name: e2e-tests

# Runs the integration_test smoke suite on an Android emulator and an iOS
# Simulator, each against a disposable HumHub backend (see scripts/e2e/README.md).
# Also called by version-release.yml to gate store uploads.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      humhub_image_tag:
        description: "humhub/humhub image tag to test against"
        required: false
        default: "1.18"
  pull_request:
    branches: [master]
  # TEMP: run on every push while developing the suite; remove before merging.
  push:
    branches: [f-internal-172-v2]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  android:
    name: Android e2e
    # TEMP: skipped while the iOS job is being set up; remove to re-enable.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HUMHUB_IMAGE_TAG: ${{ inputs.humhub_image_tag || '1.18' }}
      EMULATOR_API_LEVEL: 34
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs in the background while the toolchain and emulator are set up;
      # awaited right before the tests.
      - name: Start HumHub backend (background)
        run: |
          mkdir -p scripts/e2e/logs
          nohup scripts/e2e/up.sh > scripts/e2e/logs/up.txt 2>&1 &

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Booting from a cached snapshot instead of cold-booting a fresh AVD.
      - name: Restore AVD
        uses: actions/cache/restore@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.EMULATOR_API_LEVEL }}-google_apis-x86_64-v1

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Saved explicitly so the snapshot is cached even when the tests fail.
      - name: Save AVD
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}

      - name: Wait for HumHub backend
        timeout-minutes: 10
        run: |
          while pgrep -f scripts/e2e/up.sh > /dev/null; do sleep 2; done
          cat scripts/e2e/logs/up.txt
          test -f scripts/e2e/.e2e_fixtures.env

      - name: Run e2e tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: scripts/e2e/run_android.sh

      - name: Collect backend logs
        if: failure()
        working-directory: scripts/e2e
        run: |
          mkdir -p logs
          docker compose logs --no-color > logs/docker-compose.txt 2>&1 || true
          docker compose cp humhub:/data/logs logs/humhub || true

      # Always uploaded while the suite is being stabilised: includes a screen
      # recording of every test file and screenshots of failed tests.
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-logs
          path: scripts/e2e/logs
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS e2e
    # GitHub's Apple Silicon runners can't run Docker, so HumHub runs natively
    # here (scripts/e2e/native/), copied out of the same image as for Android.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HUMHUB_IMAGE_TAG: ${{ inputs.humhub_image_tag || '1.18' }}
      E2E_BACKEND: native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.3

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: exif, intl, zip, pdo_mysql, gd, mbstring, curl
          tools: none

      - name: Install MariaDB, crane and applesimutils
        run: |
          brew install mariadb crane wix/brew/applesimutils
          echo "HUMHUB_IMAGE_DIGEST=$(crane digest humhub/humhub:$HUMHUB_IMAGE_TAG)" >> "$GITHUB_ENV"

      - name: Cache HumHub copy
        uses: actions/cache@v4
        with:
          path: scripts/e2e/native/.cache
          key: humhub-native-${{ env.HUMHUB_IMAGE_DIGEST }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Start HumHub backend
        run: scripts/e2e/up.sh

      - name: Run e2e tests on simulator
        run: scripts/e2e/run_ios.sh

      - name: Collect backend logs
        if: failure()
        run: cp -R scripts/e2e/native/.humhub/protected/runtime/logs scripts/e2e/logs/humhub/app || true

      # Always uploaded while the suite is being stabilised: includes a screen
      # recording of every test file and screenshots of failed tests.
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ios-logs
          path: scripts/e2e/logs
          if-no-files-found: ignore
          retention-days: 7
